name = "send-direct-signaling"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Allowed browser origins (comma-separated). Includes localhost for `wrangler dev`.
[vars]
ALLOWED_ORIGINS = "https://send-direct.pages.dev,http://localhost:3000"

# Per-IP connection rate limit (60 upgrades / minute).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Optional Cloudflare TURN (for strict/symmetric NATs). Set as secrets:
#   wrangler secret put TURN_KEY_ID
#   wrangler secret put TURN_KEY_API_TOKEN
# Without them the /ice endpoint returns STUN only.

[[durable_objects.bindings]]
name = "SIGNAL_ROOM"
class_name = "SignalRoom"

# SQLite-backed Durable Object (eligible for the Workers free tier).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]
